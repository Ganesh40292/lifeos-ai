# ============================================
# Aetheria API — Application Configuration (PostgreSQL / Supabase Ready)
# ============================================

spring:
  application:
    name: lifeos-api
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ---- Database (PostgreSQL / Supabase) ----
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}?sslmode=prefer}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      keepalive-time: 30000

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        type:
          preferred_uuid_jdbc_type: VARCHAR
    open-in-view: false

  # ---- Docker Compose ----
  docker:
    compose:
      enabled: false

# ---- Server ----
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ---- JWT ----
app:
  jwt:
    secret: ${JWT_SECRET:LifeOS_Super_Secret_Key_That_Is_At_Least_256_Bits_Long_For_HMAC_SHA256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ---- Logging ----
logging:
  level:
    com.lifeos: DEBUG
    org.springframework.security: INFO
