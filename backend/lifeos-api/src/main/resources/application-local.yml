# ============================================
# Local Profile — Fast In-Memory H2 (PostgreSQL Compatibility Mode)
# Allows running the application locally without requiring a live internet/database connection.
# ============================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:lifeos_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  docker:
    compose:
      enabled: false
